[project]
name = "famous_deep_learning_cnns"
version = "0.3.0"
description = "From-scratch famous CNNs with a unified high-level PyTorch API"
authors = [
    {name = "Pablo",email = "alejogranados229@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy (>=1.26,<3.0)",
    "pillow (>=10.0,<13.0)",
    "torch (>=2.8.0,<3.0.0)",
    "torchvision (>=0.23.0,<0.24.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tqdm (>=4.70.0,<5.0.0)",
    "albumentations (>=2.0.8,<3.0.0)"
]

[project.optional-dependencies]
dev = [
    "build>=1.6.0,<2.0",
    "mypy>=2.3.1,<3.0",
    "pre-commit>=4.6.2,<5.0",
    "pytest>=9.1,<10.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.16.6,<1.0",
]

[project.scripts]
famous-cnns = "famous_cnns.cli:main"

[tool.poetry]
packages = [{include = "famous_cnns"}]
include = [
    {path = "lenet/src", format = ["sdist", "wheel"]},
    {path = "alexnet/src", format = ["sdist", "wheel"]},
    {path = "vgg/src/model", format = ["sdist", "wheel"]},
    {path = "incpetion/model", format = ["sdist", "wheel"]},
    {path = "resnet/ResNet50/src", format = ["sdist", "wheel"]},
    {path = "resnet/ResNet101/src/model", format = ["sdist", "wheel"]},
    {path = "u-net/src", format = ["sdist", "wheel"]},
    {path = "mobilenet/model", format = ["sdist", "wheel"]},
    {path = "efficient-net/model", format = ["sdist", "wheel"]},
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["famous_cnns"]
branch = true

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = "(^|/)(lenet|alexnet|vgg|incpetion|resnet|u-net|mobilenet|efficient-net)/"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

